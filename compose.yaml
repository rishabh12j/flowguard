# FlowGuard: the API and a Qdrant server.
#
#   docker compose up --build
#
# By default the API uses the Ollama already running on this computer, so the
# model isn't downloaded again. To run Ollama in a container too:
#
#   docker compose --profile ollama up --build
#   docker compose exec ollama ollama pull gemma4:12b
#
# and set FLOWGUARD_OLLAMA_URL=http://ollama:11434 in .env.

# Names the containers, image, and volumes flowguard-*, not after the folder.
name: flowguard

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FLOWGUARD_QDRANT_URL: http://qdrant:6333
      FLOWGUARD_OLLAMA_URL: ${FLOWGUARD_OLLAMA_URL:-http://host.docker.internal:11434}
      FLOWGUARD_MODEL: ${FLOWGUARD_MODEL:-gemma4:12b}
    volumes:
      - flowguard-data:/var/lib/flowguard
    extra_hosts:
      # Lets the container reach Ollama on this computer, on Linux as well.
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    # One minor version from the client (qdrant-client 1.18), which it supports.
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl, so open a TCP connection with bash.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment to give Ollama an NVIDIA GPU. Without one, gemma4:12b is very slow.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  flowguard-data:
  qdrant-data:
  ollama-models:
