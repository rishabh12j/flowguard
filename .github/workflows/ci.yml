name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          # CPU-only PyTorch, as in the Docker image. The CUDA build is ~2 GB more.
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          # The claude extra lets the Claude client be type-checked and tested; no key is used.
          pip install -e ".[dev,claude,openrca2]"

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Tests that call a real model are marked llm and excluded by the pytest config.
      - run: pytest

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag flowguard-api:ci .
