[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "mcp>=2.3,<3",
    "qdrant-client>=1.18,<2",
    "sentence-transformers>=6,<7",
    "langgraph>=1.2,<2",
    "httpx>=0.28,<1",

]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked llm call a real model and take minutes, so they only run with -m llm.
addopts = "-m 'not llm'"
markers = ["llm: calls a local model through Ollama"]
