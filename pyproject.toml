[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2",
    "mcp>=2.3,<3",
    "qdrant-client>=1.18,<2",
    "sentence-transformers>=6,<7",
    "langgraph>=1.2,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.139,<1",
    "uvicorn>=0.51,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "aiosqlite>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked llm call a real model and take minutes, so they only run with -m llm.
addopts = "-m 'not llm'"
markers = ["llm: calls a local model through Ollama"]
